<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="./index.css">

</head>

<body>

  <main class="container">

    <section class="result__section">
      
      <h3>Your Result</h3>
      
      <div class="result__circle">
        <h1>76</h1>
        <p>of 100</p>
      </div>

      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>

    </section>

    <section class="summary__section">

      <h2>Summary</h2>

      <div class="summary__container summary__reaction">
        <div>
          <img src="./assets/images/icon-reaction.svg" alt="Reaction SVG Icon">
          <h3 class="summary__action">Reaction</h3>
        </div>
        <p class="summary__progress">80 / <span>100</span></p>
      </div>

      <div class="summary__container summary__memory">
        <div>
          <img src="./assets/images/icon-memory.svg" alt="Memory SVG Icon">
          <h3 class="summary__action">Memory</h3>
        </div>
        <p class="summary__progress">92 / <span>100</span></p>
      </div>

      <div class="summary__container summary__verbal">
        <div>
          <img src="./assets/images/icon-verbal.svg" alt="Verbal SVG Icon">
          <h3 class="summary__action">Verbal</h3>
        </div>
        <p class="summary__progress">61 / <span>100</span></p>
      </div>

      <div class="summary__container summary__visual">
        <div>
          <img src="./assets/images/icon-visual.svg" alt="Visual SVG Icon">
          <h3 class="summary__action">Visual</h3>
        </div>
        <p class="summary__progress">72 / <span>100</span></p>
      </div>

      <button class="summary__button">
        Continue
      </button>

    </section>
  </main>

</body>

</html>
